[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Items DB: weekly, Sunday 2 AM Pacific (10:00 UTC covers PDT Apr-Nov)
# Change to "0 9 * * 0" for PST Nov-Mar
[functions."refresh-items-background"]
  schedule = "0 10 * * 0"

# Market prices: every hour on the hour
[functions."refresh-listings-background"]
  schedule = "0 * * * *"
