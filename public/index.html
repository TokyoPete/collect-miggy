        <CardsTab
          allCards={allCards} otherCards={otherCards} collected={collected} saveCollected={saveCollected}
          activeSeries={activeSeries} setActiveSeries={setActiveSeries}
          searchQuery={searchQuery} setSearchQuery={setSearchQuery}
          seriesStats={seriesStats} seriesMeta={seriesMeta}
          onDataChanged={loadFromCache}
        />
      )}

      {/* ── Player Search Tab ── */}
      {activeTab==="search"&&(
        <PlayerSearchTab allCards={allCards} onDataChanged={loadFromCache}/>
      )}

      {/* ── CSV Tab ── */}
      {activeTab==="csv"&&(
        <CSVTab allCards={allCards} otherCards={otherCards} collected={collected} onImport={handleImport} loadState={loadState} onItemsImported={loadFromCache}/>
      )}

      {/* Status bar */}
      <div className="status-bar">
        <div className={`sdot ${statusInfo.dot}`}/>
        <span>{statusInfo.text}</span>
      </div>
      <div className="legend">
        <span><span style={{color:"var(--green)"}}>■</span> Collected</span>
        <span><span style={{color:"var(--accent)"}}>■</span> Sell Now = asking price — cost to acquire immediately</span>
        <span><span style={{color:"var(--blue)"}}>■</span> Buy Now = current best bid — revenue if you sell now</span>
        <span>Low cost = cheapest Sell Now prices · High cost = highest Buy Now bids · Shared cache from Netlify</span>
      </div>
    </div>
  );
}

// ── CardsTab Component ────────────────────────────────────────────────────────
function CardsTab({ allCards, otherCards={}, collected, saveCollected, activeSeries, setActiveSeries, searchQuery, setSearchQuery, seriesStats, seriesMeta=[], onDataChanged }) {
  const [confirmDelete,    setConfirmDelete]    = useState(null); // {type:"card"|"collection", card?, series}
  const [confirmListings,  setConfirmListings]  = useState(null); // series name
  const [actionMsg,        setActionMsg]        = useState(null); // {text,type}
  const [refreshingCard,   setRefreshingCard]   = useState(null); // uuid being refreshed
  const [refreshingSeries, setRefreshingSeries] = useState(false);

  // All hooks must be declared before any conditional logic
  const [sortField, setSortField] = useState("ovr");
  const [sortDir,   setSortDir]   = useState("desc"); // "asc"|"desc"

  // Derived values (non-hook, after all hooks)
  const isOtherSeries   = activeSeries?.startsWith("other:");
  const otherSeriesName = isOtherSeries ? activeSeries.slice(6) : null;

  const activeData = isOtherSeries
    ? { name:otherSeriesName, cards:otherCards[otherSeriesName]||[], required:0, collectedCount:0, needed:0, totalCards:(otherCards[otherSeriesName]||[]).length, lowCost:0, highCost:0, complete:false, countMismatch:false, id:activeSeries }
    : seriesStats.find(s=>s.id===activeSeries);

  const handleSort = (field) => {
    if (sortField === field) setSortDir(d => d==="asc"?"desc":"asc");
    else { setSortField(field); setSortDir(field==="name"?"asc":"desc"); }
  };

  // Sort indicator shown in header
  const sortIcon = (field) => {
    if (sortField !== field) return <span style={{opacity:.25,fontSize:9,marginLeft:3}}>⇅</span>;
    return <span style={{fontSize:9,marginLeft:3}}>{sortDir==="asc"?"↑":"↓"}</span>;
  };

  const filteredCards = useMemo(()=>{
    if(!activeData) return[];
    const q=searchQuery.toLowerCase();
    let cards=(activeData.cards||[]).filter(c=>!q||c.name.toLowerCase().includes(q)||c.position.toLowerCase().includes(q)||(c.team||"").toLowerCase().includes(q));

    // Apply sort
    cards = [...cards].sort((a,b)=>{
      let av, bv;
      switch(sortField){
        case "ovr":          av=a.ovr||0;            bv=b.ovr||0;            break;
        case "name":         av=a.name||"";          bv=b.name||"";          break;
        case "rarity":       av=a.rarity||"";        bv=b.rarity||"";        break;
        case "position":     av=a.position||"";      bv=b.position||"";      break;
        case "team":         av=a.team||"";          bv=b.team||"";          break;
        case "sellNowPrice": av=a.sellNowPrice||0;   bv=b.sellNowPrice||0;   break;
        case "buyNowPrice":  av=a.buyNowPrice||0;    bv=b.buyNowPrice||0;    break;
        default:             av=a.ovr||0;            bv=b.ovr||0;
      }
      if (typeof av === "string") return sortDir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir==="asc" ? av-bv : bv-av;
    });
    return cards;
  },[activeData,searchQuery,sortField,sortDir]);

  const showMsg = (text,type="ok") => {
    setActionMsg({text,type});
    setTimeout(()=>setActionMsg(null), 5000);
  };

  // Delete a single card
  const doDeleteCard = async (card) => {
    setConfirmDelete(null);
    try {
      const res = await fetch(API_DELETE_CARDS, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({uuid:card.uuid}) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error||"Delete failed");
      showMsg(`✓ Removed "${card.name}" from ${SERIES_LIST.find(s=>s.id===activeSeries)?.name}`);
      onDataChanged();
    } catch(e) { showMsg(`✗ ${e.message}`,"err"); }
  };

  // Delete all cards in a collection
  const doDeleteCollection = async () => {
    setConfirmDelete(null);
    try {
      const res = await fetch(API_DELETE_CARDS, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({series_id:activeSeries}) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error||"Delete failed");
      showMsg(`✓ Cleared all ${d.deleted} cards from ${SERIES_LIST.find(s=>s.id===activeSeries)?.name}. They will return on next card refresh.`);
      onDataChanged();
    } catch(e) { showMsg(`✗ ${e.message}`,"err"); }
  };

  // Refresh listings for entire collection
  // Resolve a series_id for the Listings API. SERIES_LIST entries for
  // Cityscapes/Mural/Vintage use placeholder ids (90001-90003) since their
  // real ids weren't known when the collection was defined. If seriesMeta
  // has since resolved a real id for that series name, use it instead.
  const resolveSeriesId = (seriesId) => {
    if (!seriesId.startsWith("9000")) return seriesId;
    const name = SERIES_LIST.find(s=>s.id===seriesId)?.name;
    const real = seriesMeta.find(s=>s.name===name)?.series_id;
    return real !== undefined ? String(real) : seriesId;
  };

  const doRefreshCollectionListings = async () => {
    setConfirmListings(null);
    setRefreshingSeries(true);
    try {
      const resolvedId = resolveSeriesId(activeSeries);
      const res = await fetch(API_REFRESH_LISTING_SINGLE, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({series_id:resolvedId}) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error||"Refresh failed");
      showMsg(`✓ Refreshed prices for ${d.count} cards in ${SERIES_LIST.find(s=>s.id===activeSeries)?.name}`);
      onDataChanged();
    } catch(e) { showMsg(`✗ ${e.message}`,"err"); }
    finally { setRefreshingSeries(false); }
  };

  // Refresh single card listing + item detail
  const doRefreshCard = async (card) => {
    setRefreshingCard(card.uuid);
    try {
      const resolvedId = resolveSeriesId(activeSeries);
      // Refresh listing price
      await fetch(API_REFRESH_LISTING_SINGLE, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({uuid:card.uuid, series_id:resolvedId}) });
      // Refresh item detail (also updates name if it was a UUID placeholder)
      await fetch(API_UPDATE_ITEM, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({uuid:card.uuid}) });
      onDataChanged();
    } catch(e) { showMsg(`✗ Card refresh failed: ${e.message}`,"err"); }
    finally { setRefreshingCard(null); }
  };

  const seriesName = SERIES_LIST.find(s=>s.id===activeSeries)?.name||"";

  return (
    <div className="page">
      {/* Inline confirm dialogs */}
      {confirmDelete?.type==="card" && (
        <div className="inline-confirm">
          <div className="ic-msg">Remove <strong>{confirmDelete.card.name}</strong> from <strong>{seriesName}</strong>?<br/><span style={{color:"var(--dim)",fontSize:11}}>Your collected status for this card is preserved.</span></div>
          <div className="ic-btns">
            <button className="btn btn-danger" onClick={()=>doDeleteCard(confirmDelete.card)}>Remove Card</button>
            <button className="btn btn-secondary" onClick={()=>setConfirmDelete(null)}>Cancel</button>
          </div>
        </div>
      )}
      {confirmDelete?.type==="collection" && (
        <div className="inline-confirm">
          <div className="ic-msg">Clear all cards from <strong>{seriesName}</strong>?<br/><span style={{color:"var(--dim)",fontSize:11}}>Cards will be restored on next refresh. Your collected status is preserved.</span></div>
          <div className="ic-btns">
            <button className="btn btn-danger" onClick={doDeleteCollection}>Clear Collection</button>
            <button className="btn btn-secondary" onClick={()=>setConfirmDelete(null)}>Cancel</button>
          </div>
        </div>
      )}
      {confirmListings && (
        <div className="inline-confirm" style={{borderColor:"var(--blue)"}}>
          <div className="ic-msg">Refresh market prices for <strong>{seriesName}</strong>?<br/><span style={{color:"var(--dim)",fontSize:11}}>This fetches current buy/sell prices for all cards in this collection.</span></div>
          <div className="ic-btns">
            <button className="btn btn-primary" onClick={doRefreshCollectionListings}>Refresh Prices</button>
            <button className="btn btn-secondary" onClick={()=>setConfirmListings(null)}>Cancel</button>
          </div>
        </div>
      )}

      {/* Action status message */}
      {actionMsg && (
        <div style={{marginBottom:10,padding:"8px 12px",borderRadius:7,fontSize:12,
          background:actionMsg.type==="ok"?"#052e16":"#1a0a0a",
          border:`1px solid ${actionMsg.type==="ok"?"#065f46":"#7f1d1d"}`,
          color:actionMsg.type==="ok"?"var(--green)":"var(--red)"}}>
          {actionMsg.text}
        </div>
      )}

      {/* V-Mart series pills */}
      <div style={{fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:"var(--accent)",marginBottom:6}}>
        Victor Martinez Collections
      </div>
      <div className="pill-row">
        {SERIES_LIST.map(s=>(
          <button key={s.id} className={`pill ${activeSeries===s.id?"active":""}`}
            onClick={()=>{setActiveSeries(s.id);setSearchQuery("");setConfirmDelete(null);setConfirmListings(null);}}>
            {s.name}
          </button>
        ))}
      </div>

      {/* Other series pills */}
      {Object.keys(otherCards).length > 0 && (
        <>
          <div style={{fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:"var(--dim)",margin:"10px 0 6px"}}>
            Other Series (not part of Victor Martinez collection)
          </div>
          <div className="pill-row" style={{marginBottom:12}}>
            {Object.keys(otherCards).sort().map(seriesName=>(
              <button key={seriesName}
                className={`pill ${activeSeries===`other:${seriesName}`?"active":""}`}
                onClick={()=>{setActiveSeries(`other:${seriesName}`);setSearchQuery("");setConfirmDelete(null);setConfirmListings(null);}}>
                {seriesName}
                <span style={{fontSize:9,marginLeft:4,opacity:.7}}>({otherCards[seriesName]?.length||0})</span>
              </button>
            ))}
          </div>
        </>
      )}

      {activeSeries&&activeData?(
        <div>
          {/* Collection header + action bar */}
          <div style={{marginBottom:8}}>
            <div style={{fontSize:15,fontWeight:"bold"}}>{activeData.name}</div>
            <div style={{fontSize:11,color:"var(--dim)",marginTop:2}}>
              {activeData.collectedCount}/{activeData.required} required · {activeData.needed} still needed · {activeData.totalCards} in database
            </div>
          </div>

          {/* Collection-level actions — Victor Martinez series only */}
          {!isOtherSeries && (
            <div className="collection-actions">
              <span className="ca-label">Collection:</span>
              <button className="refresh-btn" style={{color:"var(--blue)",borderColor:"#1e3a8a",fontSize:11}}
                disabled={refreshingSeries}
                onClick={()=>{setConfirmDelete(null);setConfirmListings(seriesName);}}>
                {refreshingSeries?<><span className="spin-sm"/> Refreshing…</>:"💰 Refresh Prices"}
              </button>
              <button className="card-action-btn danger"
                onClick={()=>{setConfirmListings(null);setConfirmDelete({type:"collection"});}}>
                🗑 Clear All Cards
              </button>
            </div>
          )}
          {isOtherSeries && (
            <div style={{fontSize:11,color:"var(--dim)",marginBottom:8,padding:"6px 10px",background:"var(--surface2)",borderRadius:6}}>
              ℹ This series is not part of the Victor Martinez collection. Cards are shown for reference only.
            </div>
          )}

          <input className="search-input" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Search name, position, team…"/>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Have</th>
                  <th className="left sortable" onClick={()=>handleSort("name")}>Card Name{sortIcon("name")}</th>
                  <th className="sortable" onClick={()=>handleSort("ovr")} title="Overall Rating">OVR{sortIcon("ovr")}</th>
                  <th className="sortable" onClick={()=>handleSort("rarity")}>Rar{sortIcon("rarity")}</th>
                  <th className="sortable" onClick={()=>handleSort("position")}>Pos{sortIcon("position")}</th>
                  <th className="sortable" onClick={()=>handleSort("team")}>Team{sortIcon("team")}</th>
                  <th className="left">Where to Find</th>
                  <th className="sortable" onClick={()=>handleSort("sellNowPrice")} title="Asking price — cost to buy this card immediately">Sell Now{sortIcon("sellNowPrice")}</th>
                  <th className="sortable" onClick={()=>handleSort("buyNowPrice")} title="Current best bid — what you receive if you sell now">Buy Now{sortIcon("buyNowPrice")}</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filteredCards.length===0&&<tr><td colSpan={10} style={{textAlign:"center",padding:28,color:"var(--dim)"}}>No cards found</td></tr>}
                {filteredCards.map(card=>(
                  <tr key={card.uuid} className={collected[card.uuid]?"crow":""}>
                    <td className="center">
                      <input type="checkbox" checked={!!collected[card.uuid]}
                        onChange={()=>saveCollected({...collected,[card.uuid]:!collected[card.uuid]})}
                        style={{accentColor:"#34d399"}}/>
                    </td>
                    <td className="left" style={{fontWeight:collected[card.uuid]?"bold":"normal",color:collected[card.uuid]?"var(--green)":"var(--text)",maxWidth:150,whiteSpace:"normal",lineHeight:1.3}}>
                      {card.name}
                    </td>
                    <td className="center" style={{fontWeight:"bold",color:"var(--text)"}}>{card.ovr||"—"}</td>
                    <td className="center">
                      <span className="rbadge" style={{background:rarityBg(card.rarity)}}>
                        {card.rarity?card.rarity.charAt(0).toUpperCase():"?"}
                      </span>
                    </td>
                    <td className="center" style={{color:"var(--dim)",fontSize:11}}>{card.position}</td>
                    <td className="center" style={{color:"var(--dim)",fontSize:10}}>{card.team}</td>
                    <td className="left" style={{color:"var(--dim)",fontSize:11,whiteSpace:"normal",maxWidth:160,lineHeight:1.4}}>
                      {card.locations&&card.locations.length>0
                        ?card.locations.join(" · ")
                        :card.isSellable?"Community Market":(SOURCE_HINTS[activeSeries]||"Program Reward")}
                    </td>
                    <td className="right" style={{color:card.sellNowPrice>0?"var(--accent)":"var(--dim)"}}>
                      {card.sellNowPrice>0?card.sellNowPrice.toLocaleString():"—"}
                    </td>
                    <td className="right" style={{color:card.buyNowPrice>0?"var(--blue)":"var(--dim)"}}>
                      {card.buyNowPrice>0?card.buyNowPrice.toLocaleString():"—"}
                    </td>
                    <td className="center" style={{whiteSpace:"nowrap"}}>
                      <button className="card-action-btn info" style={{marginRight:4}}
                        disabled={refreshingCard===card.uuid}
                        onClick={()=>doRefreshCard(card)}
                        title="Refresh price and card detail from TheShow.com">
                        {refreshingCard===card.uuid?<span className="spin-sm"/>:"🔄"}
                      </button>
                      <button className="card-action-btn danger"
                        onClick={()=>{setConfirmListings(null);setConfirmDelete({type:"card",card});}}
                        title="Remove this card from the database">
                        🗑
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {!isOtherSeries && (
            <div className="cost-chips">
              <div className="chip"><span style={{color:"var(--dim)"}}>Low to finish: </span><span style={{fontWeight:"bold",color:"var(--green)"}}>{activeData.lowCost.toLocaleString()} stubs</span></div>
              <div className="chip"><span style={{color:"var(--dim)"}}>High to finish: </span><span style={{fontWeight:"bold",color:"var(--red)"}}>{activeData.highCost.toLocaleString()} stubs</span></div>
              <div className="chip"><span style={{color:"var(--dim)"}}>In database: </span><span style={{fontWeight:"bold",color:activeData.countMismatch?"var(--accent)":"var(--text)"}}>{activeData.totalCards} / {activeData.required} required</span></div>
            </div>
          )}
        </div>
      ):(
        <div className="empty">👆 Select a collection above to browse its cards</div>
      )}
    </div>
  );
}

// ── PlayerSearchTab Component ─────────────────────────────────────────────────
function PlayerSearchTab({ allCards, onDataChanged }) {
  const [query,        setQuery]        = useState("");
  const [suggestions,  setSuggestions]  = useState([]);
  const [showDropdown, setShowDropdown] = useState(false);
  const [selectedCard, setSelectedCard] = useState(null);
  const [itemDetail,   setItemDetail]   = useState(null);
  const [loading,      setLoading]      = useState(false);
  const [saveMsg,      setSaveMsg]      = useState(null);
  const inputRef = useRef();

  // Build flat card list from allCards for autocomplete
  const allCardFlat = useMemo(()=>{
    const list=[];
    for(const [sid,cards] of Object.entries(allCards)){
      for(const card of cards){
        list.push({...card, seriesId:sid, seriesName:SERIES_LIST.find(s=>s.id===sid)?.name||sid});
      }
    }
    return list;
  },[allCards]);

  useEffect(()=>{
    if(!query.trim()||query.length<2){ setSuggestions([]); setShowDropdown(false); return; }
    const q=query.toLowerCase();
    const matches=allCardFlat
      .filter(c=>c.name.toLowerCase().includes(q)||c.uuid.toLowerCase().startsWith(q))
      .slice(0,12);
    setSuggestions(matches);
    setShowDropdown(matches.length>0);
  },[query,allCardFlat]);

  const selectCard = async (card) => {
    setQuery(card.name);
    setSelectedCard(card);
    setShowDropdown(false);
    setSuggestions([]);
    setItemDetail(null);
    setSaveMsg(null);
    setLoading(true);
    try {
      // Fetch fresh item detail from Item API via the frontend (no CORS issue since we're on netlify)
      const res = await fetch(API_UPDATE_ITEM, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({uuid:card.uuid}),
      });
      const d = await res.json();
      if(!d.ok) throw new Error(d.error||"Item fetch failed");
      setItemDetail(d.card);
      if(d.isNew || JSON.stringify(d.card)!==JSON.stringify(card)){
        setSaveMsg("✓ Card data updated in database");
        onDataChanged();
      }
    } catch(e){
      setSaveMsg(`✗ Could not fetch item detail: ${e.message}`);
    }
    setLoading(false);
  };

  // Human-readable label for Item API field names
  const fieldLabel = key => ({
    ovr:"Overall Rating", position:"Position", display_position:"Display Position",
    team:"Team", team_short_name:"Team Code", rarity:"Rarity", series:"Series/Collection",
    series_year:"Series Year", jersey_number:"Jersey #", age:"Age",
    bat_hand:"Bats", throw_hand:"Throws", weight:"Weight", height:"Height", born:"Born",
    is_hitter:"Is Hitter", stamina:"Stamina", pitching_clutch:"Pitching Clutch",
    hits_per_bf:"Hits per BF", k_per_bf:"K per BF", bb_per_bf:"BB per BF", hr_per_bf:"HR per BF",
    pitch_velocity:"Pitch Velocity", pitch_control:"Pitch Control", pitch_movement:"Pitch Movement",
    contact_left:"Contact Left", contact_right:"Contact Right",
    power_left:"Power Left", power_right:"Power Right",
    plate_vision:"Plate Vision", plate_discipline:"Plate Discipline",
    batting_clutch:"Batting Clutch", bunting_ability:"Bunting Ability",
    drag_bunting_ability:"Drag Bunting", hitting_durability:"Hitting Durability",
    fielding_durability:"Fielding Durability", fielding_ability:"Fielding Ability",
    arm_strength:"Arm Strength", arm_accuracy:"Arm Accuracy",
    reaction_time:"Reaction Time", blocking:"Blocking",
    speed:"Speed", baserunning_ability:"Baserunning", baserunning_aggression:"BR Aggression",
    isSellable:"Market Sellable",
  }[key] || key.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()));

  // Fields to skip (arrays/objects rendered separately, or irrelevant)
  const SKIP_FIELDS = new Set(["uuid","name","type","img","pitches","quirks","locations",
    "series_texture_name","display_secondary_positions"]);

  const renderDetail = (detail) => {
    if(!detail) return null;
    const scalarFields = Object.entries(detail).filter(([k,v])=>
      !SKIP_FIELDS.has(k) && v!==null && v!==undefined && v!=="" && v!==false && v!==0
    );
    const pitches = detail.pitches||[];
    const quirks  = detail.quirks||[];
    const locs    = detail.locations||[];

    return (
      <div className="item-detail">
        <div className="item-detail-header">
          <div>
            <h3>{detail.name}</h3>
            <div className="id-meta">
              {detail.series} · {detail.team} · OVR {detail.ovr} · {detail.display_position}
            </div>
          </div>
          <span className="rbadge" style={{background:rarityBg(detail.rarity),fontSize:12}}>
            {detail.rarity}
          </span>
        </div>
        <div className="item-detail-body">
          {locs.length>0&&(
            <>
              <div className="item-attr-section">Where to Find</div>
              <div className="item-locations">
                {locs.map((l,i)=><span key={i} className="loc-badge">{l}</span>)}
              </div>
            </>
          )}

          <div className="item-attr-section">Card Attributes</div>
          <div className="item-attr-grid">
            {scalarFields.map(([k,v])=>(
              <div key={k} className="item-attr">
                <div className="ia-label">{fieldLabel(k)}</div>
                <div className="ia-val">{typeof v==="boolean"?v?"Yes":"No":String(v)}</div>
              </div>
            ))}
          </div>

          {pitches.length>0&&(
            <>
              <div className="item-attr-section">Pitches</div>
              <div className="item-attr-grid">
                {pitches.map((p,i)=>(
                  <div key={i} className="item-attr">
                    <div className="ia-label">{p.name}</div>
                    <div className="ia-val" style={{fontSize:11,fontWeight:"normal"}}>
                      {p.speed}mph · CTL {p.control} · MOV {p.movement}
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {quirks.length>0&&(
            <>
              <div className="item-attr-section">Quirks</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {quirks.map((q,i)=>(
                  <div key={i} title={q.description} className="item-attr" style={{cursor:"help"}}>
                    <div className="ia-label">Quirk</div>
                    <div className="ia-val" style={{fontSize:12}}>{q.name}</div>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      </div>
    );
  };

  return (
    <div className="search-tab-wrap">
      <div style={{fontSize:12,color:"var(--dim)",marginBottom:10}}>
        Search cards stored in the local database. Selecting a card fetches its full detail from TheShow.com.
      </div>

      <div className="autocomplete-wrap">
        <input ref={inputRef} className="autocomplete-input" value={query}
          onChange={e=>{setQuery(e.target.value);setSelectedCard(null);setItemDetail(null);setSaveMsg(null);}}
          onFocus={()=>suggestions.length>0&&setShowDropdown(true)}
          onBlur={()=>setTimeout(()=>setShowDropdown(false),150)}
          placeholder="Type a card name or start of UUID…"/>
        {showDropdown&&(
          <div className="autocomplete-dropdown">
            {suggestions.map(card=>(
              <div key={card.uuid} className="autocomplete-item" onMouseDown={()=>selectCard(card)}>
                <span className="ac-name">{card.name}</span>
                <span className="ac-meta">{card.seriesName} · {card.position} · {card.team}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {loading&&(
        <div style={{textAlign:"center",padding:24,color:"var(--dim)"}}>
          <span className="spin-sm"/> Loading card detail…
        </div>
      )}

      {saveMsg&&(
        <div style={{marginBottom:10,padding:"8px 12px",borderRadius:7,fontSize:12,
          background:saveMsg.startsWith("✓")?"#052e16":"#1a0a0a",
          border:`1px solid ${saveMsg.startsWith("✓")?"#065f46":"#7f1d1d"}`,
          color:saveMsg.startsWith("✓")?"var(--green)":"var(--red)"}}>
          {saveMsg}
        </div>
      )}

      {itemDetail&&renderDetail(itemDetail)}
      {!loading&&!itemDetail&&!query&&(
        <div className="empty">🔍 Type a card name above to search</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
