<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>⚾ V-Mart Collection Tracker — MLB The Show 26</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235; --border:#1e2d45;
      --accent:#e8b84b; --accent-d:#c49a30; --text:#e8eaf0; --dim:#8a95a8;
      --green:#34d399; --red:#f87171; --blue:#60a5fa; --orange:#fb923c;
    }
    html,body { background:var(--bg); color:var(--text); font-family:'Georgia',serif; min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:var(--surface)} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

    /* ── Modals ── */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10000;display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow-y:auto; }
    .modal-box { background:#0c1520;border:2px solid var(--accent);border-radius:14px;width:100%;max-width:600px;padding:18px;font-family:'Georgia',serif;margin:auto; }
    .modal-box h2 { color:var(--accent);font-size:18px;margin-bottom:3px; }
    .modal-sub { color:var(--dim);font-size:12px;margin-bottom:14px;line-height:1.5; }

    /* confirm modal */
    .confirm-box { background:#0c1520;border:2px solid var(--red);border-radius:14px;width:100%;max-width:420px;padding:20px;font-family:'Georgia',serif;margin:auto; }
    .confirm-box h2 { color:var(--red);font-size:16px;margin-bottom:8px; }
    .confirm-box p  { color:var(--dim);font-size:13px;line-height:1.6;margin-bottom:16px; }
    .confirm-box .confirm-stats { background:var(--surface2);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px; }
    .confirm-box .confirm-stats div { margin-bottom:4px; }

    .fix-step { background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px; }
    .fix-step-header { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
    .step-num { width:28px;height:28px;border-radius:50%;background:var(--accent);color:#000;font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .step-title { font-size:14px;font-weight:bold;color:var(--text); }
    .step-sub { font-size:11px;color:var(--green);margin-top:1px; }
    .step-body { font-size:12px;color:var(--dim);line-height:1.7; }
    .step-body strong { color:var(--text); }
    .step-body code { background:#111;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:11px;color:var(--blue);display:inline-block;margin:2px 0; }

    .diag-section { margin-top:14px; }
    .diag-section h3 { font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px; }
    .diag-row { display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;font-size:12px; }
    .dbadge { flex-shrink:0;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold; }
    .dbadge-ok   { background:#052e16;color:#34d399;border:1px solid #065f46; }
    .dbadge-fail { background:#450a0a;color:#f87171;border:1px solid #7f1d1d; }
    .dbadge-warn { background:#422006;color:#fbbf24;border:1px solid #78350f; }
    .diag-msg { color:var(--text);line-height:1.6;word-break:break-word; }
    .diag-code { background:#060d18;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:monospace;font-size:10px;color:#60a5fa;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto;margin-top:6px;line-height:1.5; }

    .btn-row { display:flex;gap:8px;flex-wrap:wrap;margin-top:16px; }
    .btn { padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:bold;transition:opacity .15s; }
    .btn:disabled { opacity:.45;cursor:not-allowed; }
    .btn-primary   { background:var(--accent);color:#000; }
    .btn-secondary { background:var(--surface2);color:var(--text);border:1px solid var(--border); }
    .btn-green     { background:#065f46;color:#34d399;border:1px solid #34d399; }
    .btn-danger    { background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b; }
    .diag-spinner  { display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px; }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── App chrome ── */
    .app-header { background:linear-gradient(135deg,#0a0e1a 0%,#0d1a2e 50%,#0a1628 100%);border-bottom:2px solid var(--accent);padding:14px 16px; }
    .eyebrow { font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:4px; }
    .app-header h1 { font-size:19px;font-weight:bold;line-height:1.2; }
    .app-header .sub { font-size:11px;color:var(--dim);margin-top:2px; }
    .header-stats { display:flex;gap:14px;margin-top:10px;flex-wrap:wrap; }
    .stat-box .stat-label { font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase; }
    .stat-box .stat-value { font-size:18px;font-weight:bold; }

    .tabs { display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch; }
    .tab-btn { flex-shrink:0;padding:11px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap; }
    .tab-btn.active { border-bottom-color:var(--accent);color:var(--accent); }
    .tab-right { margin-left:auto;display:flex; }
    .tab-icon-btn { padding:10px 12px;background:none;border:none;color:var(--dim);font-size:12px;font-family:inherit;cursor:pointer;flex-shrink:0; }

    .page { padding:14px; }
    .cabrera-banner { background:linear-gradient(135deg,var(--surface2),#1a1000);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:14px; }
    .cabrera-banner h2 { font-size:16px;font-weight:bold;margin-top:3px; }
    .cabrera-banner .note { font-size:11px;color:var(--dim);margin-top:2px; }
    .cabrera-costs { display:flex;gap:18px;margin-top:10px;flex-wrap:wrap; }
    .cost-label { font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase; }
    .cost-value { font-size:19px;font-weight:bold; }
    .cost-unit  { font-size:10px;color:var(--dim); }
    .alert { border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px; }
    .alert-warn { background:#1a1500;border:1px solid var(--accent-d);color:var(--accent); }
    .alert-err  { background:#1a0a0a;border:1px solid var(--red);color:var(--red); }
    .alert-ok   { background:#052e16;border:1px solid #065f46;color:var(--green); }

    .table-wrap { background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch; }
    table { width:100%;border-collapse:collapse;font-size:12px; }
    thead { background:var(--surface2); }
    th { padding:8px 9px;text-align:center;color:var(--dim);font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;white-space:nowrap; }
    th.left,td.left { text-align:left; }
    td { padding:7px 9px;vertical-align:middle;border-bottom:1px solid var(--border);white-space:nowrap; }
    td.center{text-align:center} td.right{text-align:right}
    tfoot td { border-top:2px solid var(--accent);border-bottom:none;background:var(--surface2);font-weight:bold; }
    tr:last-child td { border-bottom:none; }
    tr.crow { background:rgba(52,211,153,.05); }
    tr.xrow { opacity:.4;background:rgba(0,0,0,.3); }
    .rbadge { display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:bold;color:#000; }

    .pill-row { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px; }
    .pill { padding:5px 12px;border-radius:18px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap; }
    .pill.active { background:var(--accent);border-color:var(--accent);color:#000;font-weight:bold; }

    .search-input { padding:8px 12px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;font-family:inherit;-webkit-appearance:none;margin-bottom:10px; }
    .search-input:focus { outline:none;border-color:var(--accent-d); }
    .cost-chips { display:flex;gap:8px;flex-wrap:wrap;margin-top:10px; }
    .chip { background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:12px; }
    .empty { text-align:center;padding:40px 16px;color:var(--dim);font-size:14px; }
    .prog-pill { font-size:10px;font-weight:bold;color:var(--accent); }
    .prog-done { color:var(--green); }
    .view-btn { padding:3px 9px;background:var(--surface2);border:1px solid var(--border);color:var(--accent);font-size:11px;font-family:inherit;border-radius:4px;cursor:pointer; }
    th.sortable { cursor:pointer;user-select:none; }
    th.sortable:hover { color:var(--accent); }

    /* ── Card action buttons (delete, refresh per-card) ── */
    .card-action-btn { padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);font-size:10px;font-family:inherit;cursor:pointer;line-height:1.6; }
    .card-action-btn.danger { color:var(--red);border-color:#7f1d1d; }
    .card-action-btn.info   { color:var(--blue);border-color:#1e3a8a; }
    .card-action-btn:disabled { opacity:.4;cursor:not-allowed; }

    /* ── Inline confirm banner ── */
    .inline-confirm { background:#1a0a0a;border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:12px; }
    .inline-confirm .ic-msg { color:var(--text);margin-bottom:8px;line-height:1.5; }
    .inline-confirm .ic-btns { display:flex;gap:8px; }

    /* ── Collection action bar (above cards table) ── */
    .collection-actions { display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border); }
    .collection-actions .ca-label { font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin-right:4px; }

    /* ── CSV Tab ── */
    .csv-section { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px; }
    .csv-section h3 { font-size:13px;font-weight:bold;color:var(--text);margin-bottom:6px; }
    .csv-section p  { font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:12px; }
    .csv-meta { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px; }
    .csv-meta-chip { background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:11px; }
    .csv-meta-chip .cm-label { color:var(--dim); }
    .csv-meta-chip .cm-val   { color:var(--text);font-weight:bold; }
    .csv-preview { background:#060d18;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:monospace;font-size:11px;color:#60a5fa;white-space:pre;overflow-x:auto;margin-bottom:12px;line-height:1.5; }
    .drop-zone { border:2px dashed var(--border);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s; }
    .drop-zone:hover,.drop-zone.drag-over { border-color:var(--accent);background:rgba(232,184,75,.06); }
    .drop-zone .dz-icon  { font-size:32px;margin-bottom:8px; }
    .drop-zone .dz-title { font-size:14px;font-weight:bold;color:var(--text);margin-bottom:4px; }
    .drop-zone .dz-sub   { font-size:12px;color:var(--dim); }
    .hidden-file { display:none; }
    .import-result { border-radius:8px;padding:12px 14px;margin-top:12px;font-size:12px;line-height:1.7; }
    .import-result.ok   { background:#052e16;border:1px solid #065f46;color:var(--green); }
    .import-result.warn { background:#1a1500;border:1px solid var(--accent-d);color:var(--accent); }
    .import-result.err  { background:#1a0a0a;border:1px solid var(--red);color:var(--red); }
    .import-result.info { background:#0c1a3a;border:1px solid #1e3a8a;color:var(--blue); }

    /* ── Player Search Tab ── */
    .search-tab-wrap { padding:14px; }
    .autocomplete-wrap { position:relative;margin-bottom:14px; }
    .autocomplete-input { padding:10px 14px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;-webkit-appearance:none; }
    .autocomplete-input:focus { outline:none;border-color:var(--accent-d); }
    .autocomplete-dropdown { position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--accent-d);border-radius:0 0 8px 8px;z-index:100;max-height:240px;overflow-y:auto; }
    .autocomplete-item { padding:9px 14px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center; }
    .autocomplete-item:hover,.autocomplete-item.active { background:var(--surface2); }
    .autocomplete-item:last-child { border-bottom:none; }
    .autocomplete-item .ac-name { color:var(--text);font-weight:bold; }
    .autocomplete-item .ac-meta { color:var(--dim);font-size:10px; }

    /* ── Item Detail Panel ── */
    .item-detail { background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden; }
    .item-detail-header { background:var(--surface2);padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px; }
    .item-detail-header h3 { font-size:17px;font-weight:bold; }
    .item-detail-header .id-meta { font-size:11px;color:var(--dim);margin-top:3px; }
    .item-detail-body { padding:14px; }
    .item-attr-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px; }
    .item-attr { background:var(--surface2);border-radius:6px;padding:7px 10px; }
    .item-attr .ia-label { font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:2px; }
    .item-attr .ia-val   { font-size:13px;color:var(--text);font-weight:bold; }
    .item-attr-section { font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px; }
    .item-locations { display:flex;flex-wrap:wrap;gap:6px;margin-top:6px; }
    .loc-badge { background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px 10px;font-size:11px;color:var(--blue); }

    /* ── Data Refresh Panel ── */
    .refresh-panel { background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center; }
    .refresh-block { display:flex;flex-direction:column;gap:3px;flex:1;min-width:160px; }
    .refresh-block-label { font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim); }
    .refresh-ts { font-size:10px;color:var(--dim);margin-top:1px; }
    .refresh-ts.ok  { color:var(--green); }
    .refresh-ts.old { color:var(--accent); }
    .refresh-ts.none{ color:var(--red); }
    .refresh-btn { display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:border-color .15s; }
    .refresh-btn:hover:not(:disabled) { border-color:var(--accent);color:var(--accent); }
    .refresh-btn:disabled { opacity:.45;cursor:not-allowed; }
    .refresh-divider { width:1px;background:var(--border);align-self:stretch;flex-shrink:0; }

    .status-bar { background:var(--surface2);border-top:1px solid var(--border);padding:7px 14px;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
    .sdot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
    .dot-ok{background:var(--green)} .dot-err{background:var(--red)} .dot-warn{background:#fbbf24}
    .dot-spin{background:var(--accent);animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .spin-sm { display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite; }

    .legend { border-top:1px solid var(--border);padding:10px 14px;font-size:10px;color:var(--dim);display:flex;flex-wrap:wrap;gap:10px;line-height:1.6; }
    input[type=checkbox] { width:18px;height:18px;cursor:pointer;flex-shrink:0; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ── Constants ─────────────────────────────────────────────────────────────────
const BASE      = "https://mlb26.theshow.com";
const LS_KEY    = "cabrera_v3";
const CSV_FILENAME = "inventory.csv";
const CSV_HEADERS  = ["uuid", "card_name", "collection"];

const API_GET_CACHE              = "/api/get-cache";
const API_REFRESH_ITEMS          = "/api/refresh-items";
const API_REFRESH_LISTINGS       = "/api/refresh-listings";
const API_REFRESH_LISTING_SINGLE = "/api/refresh-listing-single";
const API_UPDATE_ITEM            = "/api/update-item";
const API_DELETE_CARDS           = "/api/delete-cards";
const API_CANCEL_REFRESH         = "/api/cancel-refresh";
const THESHOW_ITEM_API           = "https://mlb26.theshow.com/apis/item.json";

// Fallback proxies for direct TheShow API calls (used only if cache is empty)
const PROXIES = [
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
];

// Format an ISO timestamp as "mm/dd/yy hh:mm" in local time
function fmtTs(isoStr) {
  if (!isoStr) return "Never";
  const d = new Date(isoStr);
  if (isNaN(d)) return "Unknown";
  const mm   = String(d.getMonth() + 1).padStart(2, "0");
  const dd   = String(d.getDate()).padStart(2, "0");
  const yy   = String(d.getFullYear()).slice(-2);
  const hh   = String(d.getHours()).padStart(2, "0");
  const min  = String(d.getMinutes()).padStart(2, "0");
  return `${mm}/${dd}/${yy} ${hh}:${min}`;
}

// How old is a timestamp in hours?
function hoursAgo(isoStr) {
  if (!isoStr) return Infinity;
  return (Date.now() - new Date(isoStr).getTime()) / 3_600_000;
}

function parseProxyResponse(text, i) {
  if (i === 2) { const w = JSON.parse(text); if (w.contents) return JSON.parse(w.contents); }
  return JSON.parse(text);
}

// Victor Martinez Legends & Flashbacks collection — 26 series, 24 required.
// IDs marked with a comment are placeholders pending real series_ids from the
// metadata API (Cityscapes, Mural, Vintage are new series for this collection).
const SERIES_LIST = [
  { id:"10028", name:"World Baseball Classic", required:142 },
  { id:"10047", name:"Spotlight",              required:70  },
  { id:"10017", name:"Topps Now",              required:63  },
  { id:"10004", name:"All-Star",               required:45  },
  { id:"10005", name:"Awards",                 required:32  },
  { id:"10035", name:"The Negro Leagues",       required:31  },
  { id:"90001", name:"Cityscapes",             required:30  }, // placeholder ID
  { id:"10046", name:"Jolt",                   required:40  },
  { id:"90002", name:"Mural",                  required:29  }, // placeholder ID
  { id:"90003", name:"Vintage",                required:27  }, // placeholder ID
  { id:"10050", name:"New Threads",            required:23  },
  { id:"10044", name:"Contributor",            required:19  },
  { id:"10002", name:"Breakout",               required:18  },
  { id:"10020", name:"2nd Half Heroes",        required:18  },
  { id:"10043", name:"Egg Hunt",               required:17  },
  { id:"10039", name:"Spring Breakout",        required:16  },
  { id:"10006", name:"Postseason",             required:12  },
  { id:"10003", name:"Veteran",                required:12  },
  { id:"10022", name:"Milestone",              required:9   },
  { id:"10034", name:"Standout",               required:8   },
  { id:"10062", name:"St. Patrick's Day",      required:8   },
  { id:"10001", name:"Rookie",                 required:7   },
  { id:"10049", name:"Cornerstone",            required:4   },
  { id:"10045", name:"Last Ride",              required:2   },
  { id:"10013", name:"Prime",                  required:2   },
  { id:"10009", name:"Signature",              required:1   },
];

const TOTAL_SERIES_COUNT    = 26;
const REQUIRED_SERIES_COUNT = 24;

const SERIES_NAME = Object.fromEntries(SERIES_LIST.map(s => [s.id, s.name]));

const SOURCE_HINTS = {
  "10046":"Jolt Program rewards",
  "10044":"Contributor Program / Moments",
  "10003":"Veteran Program rewards",
  "10006":"Postseason Program rewards",

// ── CSV helpers ───────────────────────────────────────────────────────────────

// Escape a single CSV field value
function csvEscape(val) {
  const s = String(val ?? "");
  return s.includes(",") || s.includes('"') || s.includes("\n")
    ? `"${s.replace(/"/g, '""')}"` : s;
}

// Build CSV string from collected map + allCards lookup
function buildCSV(collected, allCards) {
  const rows = [CSV_HEADERS.join(",")];
  // Walk every card in every series in SERIES_LIST order
  for (const series of SERIES_LIST) {
    const cards = allCards[series.id] || [];
    for (const card of cards) {
      if (collected[card.uuid]) {
        rows.push([
          csvEscape(card.uuid),
          csvEscape(card.name),
          csvEscape(series.name),
        ].join(","));
      }
    }
  }
  return rows.join("\r\n");
}

// Trigger a file download in the browser
function downloadCSV(csvString) {
  const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = CSV_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Parse a CSV string → new collected map { uuid: true }
// Only the uuid column is required; card_name and collection are ignored on import.
function parseCSV(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  if (lines.length < 2) return { ok: false, error: "File appears empty or has no data rows.", collected: {}, count: 0 };

  // Parse header to find uuid column index (case-insensitive, trimmed)
  const header = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, "").toLowerCase());
  const uuidIdx = header.indexOf("uuid");
  if (uuidIdx === -1) return { ok: false, error: 'No "uuid" column found in header row. Expected: uuid,card_name,collection', collected: {}, count: 0 };

  const newCollected = {};
  let count = 0;
  let skipped = 0;

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    // Simple CSV field split respecting quoted fields
    const fields = splitCSVLine(line);
    const uuid = (fields[uuidIdx] || "").trim().replace(/^"|"$/g, "");
    if (uuid) {
      newCollected[uuid] = true;
      count++;
    } else {
      skipped++;
    }
  }

  if (count === 0) return { ok: false, error: "No valid UUID values found in the file.", collected: {}, count: 0 };
  return { ok: true, error: null, collected: newCollected, count, skipped };
}

// Minimal CSV line splitter that handles quoted fields with commas
function splitCSVLine(line) {
  const fields = [];
  let cur = "", inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else { inQuote = !inQuote; }
    } else if (c === "," && !inQuote) {
      fields.push(cur); cur = "";
    } else {
      cur += c;
    }
  }
  fields.push(cur);
  return fields;
}

// ── Fetch helpers ──────────────────────────────────────────────────────────────

// Detect which response field to expect based on the URL
function responseKey(url) {
  if (url.includes("/items.json"))    return "items";
  if (url.includes("/listings.json")) return "listings";
  return null; // unknown — accept any parseable JSON
}

async function fetchWithFallback(url) {
  const log = [];
  const key = responseKey(url);

  const validate = (d) => {
    if (!key) return true;               // no validation needed
    if (d[key] !== undefined) return true; // expected field present
    // Be lenient: if the object has page info it's probably the right shape
    if (d.page !== undefined && d.total_pages !== undefined) return true;
    throw new Error(`Expected "${key}" field in response, got keys: ${Object.keys(d).join(", ")}`);
  };

  // 1. Direct
  try {
    log.push(`DIRECT → ${url.substring(0,80)}`);
    const r = await fetch(url, { mode:"cors", cache:"no-store" });
    log.push(`  status: ${r.status}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    validate(d);
    log.push(`  ✓ ${key||"data"}: ${d[key]?.length ?? "ok"}`);
    return { data:d, method:"direct", log };
  } catch(e) { log.push(`  ✗ ${e.name}: ${e.message}`); }

  // 2. Proxies — codetabs first (confirmed working), others as fallback
  const orderedProxies = [
    { idx:0, fn: u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`, wrap: false },
    { idx:2, fn: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,       wrap: true  },
    { idx:1, fn: u => `https://thingproxy.freeboard.io/fetch/${u}`,                        wrap: false },
  ];

  for (const proxy of orderedProxies) {
    const proxied = proxy.fn(url);
    try {
      log.push(`PROXY${proxy.idx+1} → ${proxied.substring(0,80)}…`);
      const r = await fetch(proxied, { cache:"no-store" });
      log.push(`  status: ${r.status}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const text = await r.text();
      log.push(`  preview: ${text.substring(0,80)}`);
      let d;
      if (proxy.wrap) {
        const wrapper = JSON.parse(text);
        d = JSON.parse(wrapper.contents);
      } else {
        d = JSON.parse(text);
      }
      validate(d);
      log.push(`  ✓ ${key||"data"}: ${d[key]?.length ?? "ok"}`);
      return { data:d, method:`proxy${proxy.idx+1}`, log };
    } catch(e) { log.push(`  ✗ ${e.name}: ${e.message}`); }
  }

  return { data:null, method:null, log };
}

// Items CSV helpers
const ITEMS_CSV_FILENAME = "all_cards.csv";
const ITEMS_CSV_HEADERS  = ["uuid","name","position","team","rarity","ovr","series","locations","isSellable"];
const LOCATIONS_SEPARATOR = " | "; // consistent separator for locations array in CSV

function buildItemsCSV(allCards, otherCards) {
  const rows = [ITEMS_CSV_HEADERS.join(",")];
  // Victor Martinez series
  for (const series of SERIES_LIST) {
    for (const card of (allCards[series.id]||[])) {
      const locs = Array.isArray(card.locations) ? card.locations.join(LOCATIONS_SEPARATOR) : (card.locations||"");
      rows.push([
        csvEscape(card.uuid), csvEscape(card.name), csvEscape(card.position),
        csvEscape(card.team), csvEscape(card.rarity), csvEscape(card.ovr||""),
        csvEscape(card.series||series.name), csvEscape(locs),
        csvEscape(card.isSellable?"true":"false"),
      ].join(","));
    }
  }
  // Other series
  for (const [seriesName, cards] of Object.entries(otherCards)) {
    for (const card of (cards||[])) {
      const locs = Array.isArray(card.locations) ? card.locations.join(LOCATIONS_SEPARATOR) : (card.locations||"");
      rows.push([
        csvEscape(card.uuid), csvEscape(card.name), csvEscape(card.position),
        csvEscape(card.team), csvEscape(card.rarity), csvEscape(card.ovr||""),
        csvEscape(card.series||seriesName), csvEscape(locs),
        csvEscape(card.isSellable?"true":"false"),
      ].join(","));
    }
  }
  return rows.join("\r\n");
}

// Parse an items CSV — returns {ok, cards:[], errors:[], skipped}
// uuid is the primary key. Merges into existing data (update + add, no delete).
function parseItemsCSV(text) {
  const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
  if (lines.length < 2) return { ok:false, error:"File is empty or has no data rows.", cards:[], errors:[], skipped:0 };

  const header = lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
  const uuidIdx      = header.indexOf("uuid");
  const nameIdx      = header.indexOf("name");
  const posIdx       = header.indexOf("position");
  const teamIdx      = header.indexOf("team");
  const rarityIdx    = header.indexOf("rarity");
  const ovrIdx       = header.indexOf("ovr");
  const seriesIdx    = header.indexOf("series");
  const locsIdx      = header.indexOf("locations");
  const sellableIdx  = header.indexOf("issellable");

  if (uuidIdx === -1) return { ok:false, error:'No "uuid" column found. Required header: uuid,name,position,team,rarity,ovr,series,locations,isSellable', cards:[], errors:[], skipped:0 };

  const cards = [];
  const errors = [];
  let skipped = 0;

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const fields = splitCSVLine(line);
    const uuid = (fields[uuidIdx]||"").trim().replace(/^"|"$/g,"");
    if (!uuid) { skipped++; continue; }

    // Parse locations — must be separated by LOCATIONS_SEPARATOR
    let locations = [];
    if (locsIdx !== -1) {
      const rawLocs = (fields[locsIdx]||"").trim().replace(/^"|"$/g,"");
      if (rawLocs) {
        // Validate format — must use " | " separator (or be a single value with no separator)
        if (rawLocs.includes("|") && !rawLocs.includes(LOCATIONS_SEPARATOR.trim())) {
          errors.push({
            row: i+1,
            value: rawLocs,
            message: `Invalid locations format on row ${i+1}. Found: "${rawLocs}". Use " | " (space-pipe-space) to separate multiple locations. Example: "PROGRAM (Team Affinity) | MARKET"`,
          });
          skipped++;
          continue;
        }
        locations = rawLocs.includes(LOCATIONS_SEPARATOR)
          ? rawLocs.split(LOCATIONS_SEPARATOR).map(l=>l.trim()).filter(Boolean)
          : rawLocs ? [rawLocs] : [];
      }
    }

    const isSellable = sellableIdx !== -1
      ? (fields[sellableIdx]||"").trim().toLowerCase() === "true"
      : locations.some(l=>l.toUpperCase().includes("MARKET")||l.toUpperCase().includes("EXCHANGE"));

    cards.push({
      uuid,
      name:      nameIdx     !== -1 ? (fields[nameIdx]||"").trim().replace(/^"|"$/g,"")    : "",
      position:  posIdx      !== -1 ? (fields[posIdx]||"").trim().replace(/^"|"$/g,"")     : "",
      team:      teamIdx     !== -1 ? (fields[teamIdx]||"").trim().replace(/^"|"$/g,"")    : "",
      rarity:    rarityIdx   !== -1 ? (fields[rarityIdx]||"").trim().replace(/^"|"$/g,"")  : "",
      ovr:       ovrIdx      !== -1 ? Number((fields[ovrIdx]||"0").trim())||0              : 0,
      series:    seriesIdx   !== -1 ? (fields[seriesIdx]||"").trim().replace(/^"|"$/g,"")  : "",
      locations,
      isSellable,
    });
  }

  return { ok:true, cards, errors, skipped };
}

function CSVTab({ allCards, otherCards={}, collected, onImport, loadState, onItemsImported }) {
  // ── Collection inventory state ──
  const fileInputRef    = useRef();
  const itemsFileRef    = useRef();
  const [dragOver,      setDragOver]      = useState(false);
  const [itemsDragOver, setItemsDragOver] = useState(false);
  const [importResult,  setImportResult]  = useState(null);
  const [pendingImport, setPendingImport] = useState(null);
  const [parseStats,    setParseStats]    = useState(null);
  // ── Items database state ──
  const [itemsImportResult, setItemsImportResult] = useState(null);
  const [itemsImporting,    setItemsImporting]    = useState(false);
  const [activeSection,     setActiveSection]     = useState("inventory"); // "inventory"|"items"

  const totalCollected = Object.values(collected).filter(Boolean).length;
  const canExport = loadState === "done" && totalCollected > 0;
  const totalItems = Object.values(allCards).reduce((a,c)=>a+c.length,0) + Object.values(otherCards).reduce((a,c)=>a+c.length,0);
  const canExportItems = totalItems > 0;

  const cardLookup = useMemo(()=>{
    const map={};
    for(const series of SERIES_LIST)
      for(const card of (allCards[series.id]||[]))
        map[card.uuid]={name:card.name,seriesId:series.id};
    return map;
  },[allCards]);

  // ── Collection inventory handlers ──
  const handleExport = () => {
    if(!canExport) return;
    downloadCSV(buildCSV(collected,allCards));
    setImportResult({ok:true,type:"ok",message:`✓ Exported ${totalCollected} collected cards to ${CSV_FILENAME}`});
  };

  const processInventoryFile = (file) => {
    if(!file) return;
    if(!file.name.toLowerCase().endsWith(".csv")){ setImportResult({ok:false,type:"err",message:"Please select a .csv file."}); return; }
    const reader=new FileReader();
    reader.onload=(e)=>{
      const result=parseCSV(e.target.result);
      if(!result.ok){ setImportResult({ok:false,type:"err",message:`Import error: ${result.error}`}); return; }
      const unmatched=Object.keys(result.collected).filter(u=>!cardLookup[u]).length;
      setParseStats({count:result.count,current:totalCollected,skipped:result.skipped,unmatched,parsed:result.collected});
      setPendingImport(result.collected);
      setImportResult(null);
    };
    reader.onerror=()=>setImportResult({ok:false,type:"err",message:"Failed to read file."});
    reader.readAsText(file);
  };

  const confirmImport=()=>{
    onImport(pendingImport);
    setImportResult({ok:true,type:"ok",message:`✓ Imported ${parseStats.count} cards. Local storage replaced.${parseStats.unmatched>0?` (${parseStats.unmatched} UUIDs not in database — still saved.)`:""}` });
    setPendingImport(null); setParseStats(null);
  };

  // ── Items database handlers ──
  const handleExportItems = () => {
    if(!canExportItems) return;
    const csv = buildItemsCSV(allCards, otherCards);
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=ITEMS_CSV_FILENAME;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    setItemsImportResult({type:"ok",message:`✓ Exported ${totalItems} cards to ${ITEMS_CSV_FILENAME}`});
  };

  const processItemsFile = async (file) => {
    if(!file) return;
    if(!file.name.toLowerCase().endsWith(".csv")){ setItemsImportResult({type:"err",message:"Please select a .csv file."}); return; }
    setItemsImporting(true);
    setItemsImportResult(null);
    const reader=new FileReader();
    reader.onload=async(e)=>{
      const result=parseItemsCSV(e.target.result);
      if(!result.ok){ setItemsImportResult({type:"err",message:result.error}); setItemsImporting(false); return; }

      // Show location format errors before proceeding
      if(result.errors.length>0){
        const errMsgs = result.errors.slice(0,3).map(e=>e.message).join("\n");
        const more = result.errors.length>3 ? `\n…and ${result.errors.length-3} more rows with the same issue.` : "";
        setItemsImportResult({type:"err",message:`Location format errors found:\n\n${errMsgs}${more}\n\nCorrect format: use " | " (space-pipe-space) to separate multiple locations.\nExample: PROGRAM (Team Affinity) | MARKET`});
        setItemsImporting(false); return;
      }

      if(result.cards.length===0){ setItemsImportResult({type:"warn",message:"No valid cards found in file."}); setItemsImporting(false); return; }

      // POST cards to update-item endpoint one batch at a time
      // We use the delete-cards wipe_all=false path — actually we call update-item for each
      // For bulk import we call a special path on delete-cards with the full payload
      // Since update-item only accepts one UUID at a time, we do it client-side via the store
      // Instead: POST to a new import endpoint. Since we don't have one yet, we write directly
      // via the existing update-item for each card (but that's too slow for bulk).
      // Practical approach: send the entire parsed array to update-item with mode:"bulk"
      // update-item.js already handles single cards — we'll call it per card in batches.

      let updated=0, added=0, failed=0;
      const BATCH=5;
      for(let i=0;i<result.cards.length;i+=BATCH){
        const batch=result.cards.slice(i,i+BATCH);
        await Promise.all(batch.map(async card=>{
          try{
            const res=await fetch(API_UPDATE_ITEM,{
              method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({uuid:card.uuid,cardData:card}),
            });
            const d=await res.json();
            if(d.ok){ d.isNew?added++:updated++; } else failed++;
          }catch{ failed++; }
        }));
        setItemsImportResult({type:"info",message:`Importing… ${Math.min(i+BATCH,result.cards.length)} / ${result.cards.length} cards`});
      }
      setItemsImportResult({type:"ok",message:`✓ Import complete: ${added} added, ${updated} updated, ${failed} failed out of ${result.cards.length} cards.`});
      if(onItemsImported) onItemsImported();
      setItemsImporting(false);
    };
    reader.onerror=()=>{ setItemsImportResult({type:"err",message:"Failed to read file."}); setItemsImporting(false); };
    reader.readAsText(file);
  };

  const sampleInventory=["uuid,card_name,collection","a1b2c3…,Mike Trout,Spotlight","f6e5d4…,Shohei Ohtani,All-Star"].join("\n");
  const sampleItems=[
    "uuid,name,position,team,rarity,ovr,series,locations,isSellable",
    "a1b2c3…,Mike Trout,CF,Angels,Diamond,99,Spotlight,PROGRAM (Spotlight) | MARKET,true",
  ].join("\n");

  return (
    <div className="page">
      {pendingImport&&parseStats&&(
        <ImportConfirmModal stats={parseStats} onConfirm={confirmImport} onCancel={()=>{setPendingImport(null);setParseStats(null);}}/>
      )}

      {/* Section toggle */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button className={`pill ${activeSection==="inventory"?"active":""}`} onClick={()=>setActiveSection("inventory")}>🎴 Collection Inventory</button>
        <button className={`pill ${activeSection==="items"?"active":""}`}     onClick={()=>setActiveSection("items")}>🗃 Card Database</button>
      </div>

      {/* ── COLLECTION INVENTORY SECTION ── */}
      {activeSection==="inventory"&&(
        <>
          <div className="csv-section">
            <h3>📤 Export Collection</h3>
            <p>Downloads your checked cards as <strong>uuid, card_name, collection</strong>. Use to share collected status across devices.</p>
            <div className="csv-meta">
              <div className="csv-meta-chip"><span className="cm-label">Collected: </span><span className="cm-val">{totalCollected}</span></div>
              <div className="csv-meta-chip"><span className="cm-label">File: </span><span className="cm-val">{CSV_FILENAME}</span></div>
            </div>
            <div className="csv-preview">{sampleInventory}</div>
            <button className="btn btn-primary" onClick={handleExport} disabled={!canExport}>
              {canExport?`⬇ Export ${totalCollected} Cards`:"⬇ Export (no cards collected yet)"}
            </button>
          </div>

          <div className="csv-section">
            <h3>📥 Import Collection</h3>
            <p><strong>UUID is the only required field.</strong> Importing <strong>completely replaces</strong> your current collection in local storage. card_name and collection are ignored.</p>
            <div className={`drop-zone ${dragOver?"drag-over":""}`}
              onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
              onDrop={e=>{e.preventDefault();setDragOver(false);processInventoryFile(e.dataTransfer.files[0]);}}
              onClick={()=>fileInputRef.current?.click()}>
              <div className="dz-icon">📂</div>
              <div className="dz-title">Tap to select or drag & drop</div>
              <div className="dz-sub">.csv only · replaces entire collection</div>
            </div>
            <input ref={fileInputRef} type="file" accept=".csv" className="hidden-file" onChange={e=>{processInventoryFile(e.target.files[0]);e.target.value="";}}/>
            {importResult&&<div className={`import-result ${importResult.type}`}>{importResult.message}</div>}
          </div>

          <div className="csv-section" style={{background:"transparent",border:"1px solid var(--border)"}}>
            <h3 style={{color:"var(--dim)"}}>Notes</h3>
            <p style={{marginBottom:0,whiteSpace:"pre-line"}}>• Only checked cards are exported — unchecked cards are omitted.{"\n"}• UUIDs not in the current database are still saved and activate when that card is added.{"\n"}• To sync: export on device A → share file → import on device B.{"\n"}• Collection include/exclude checkboxes are not exported.</p>
          </div>
        </>
      )}

      {/* ── CARD DATABASE SECTION ── */}
      {activeSection==="items"&&(
        <>
          <div className="csv-section">
            <h3>📤 Export Card Database</h3>
            <p>Exports all stored card records with full attributes. Columns: <strong>uuid, name, position, team, rarity, ovr, series, locations, isSellable</strong>.</p>
            <div className="csv-meta">
              <div className="csv-meta-chip"><span className="cm-label">Total cards: </span><span className="cm-val">{totalItems}</span></div>
              <div className="csv-meta-chip"><span className="cm-label">File: </span><span className="cm-val">{ITEMS_CSV_FILENAME}</span></div>
            </div>
            <div className="csv-preview">{sampleItems}</div>
            <button className="btn btn-primary" onClick={handleExportItems} disabled={!canExportItems}>
              {canExportItems?`⬇ Export ${totalItems} Cards`:"⬇ Export (no card data loaded)"}
            </button>
          </div>

          <div className="csv-section">
            <h3>📥 Import Card Database</h3>
            <p>Merges card records into the stored database. <strong>UUID is the primary key.</strong> Existing records are updated; new UUIDs are added. No records are deleted.</p>
            <p style={{marginTop:6,fontSize:11,color:"var(--accent)"}}>⚠ Locations must use <strong>" | "</strong> (space-pipe-space) as the separator between multiple values. Example: <code style={{background:"#111",padding:"1px 4px",borderRadius:3,fontFamily:"monospace"}}>PROGRAM (Team Affinity) | MARKET</code></p>
            <div className={`drop-zone ${itemsDragOver?"drag-over":""}`}
              onDragOver={e=>{e.preventDefault();setItemsDragOver(true);}} onDragLeave={()=>setItemsDragOver(false)}
              onDrop={e=>{e.preventDefault();setItemsDragOver(false);processItemsFile(e.dataTransfer.files[0]);}}
              onClick={()=>!itemsImporting&&itemsFileRef.current?.click()}>
              <div className="dz-icon">{itemsImporting?"⏳":"🗃"}</div>
              <div className="dz-title">{itemsImporting?"Import in progress…":"Tap to select or drag & drop"}</div>
              <div className="dz-sub">.csv only · merges with existing data</div>
            </div>
            <input ref={itemsFileRef} type="file" accept=".csv" className="hidden-file" onChange={e=>{processItemsFile(e.target.files[0]);e.target.value="";}}/>
            {itemsImportResult&&(
              <div className={`import-result ${itemsImportResult.type}`} style={{whiteSpace:"pre-wrap"}}>
                {itemsImportResult.message}
              </div>
            )}
          </div>

          <div className="csv-section" style={{background:"transparent",border:"1px solid var(--border)"}}>
            <h3 style={{color:"var(--dim)"}}>Notes</h3>
            <p style={{marginBottom:0,whiteSpace:"pre-line"}}>• Import merges records — it never deletes. Use the collection delete buttons for removal.{"\n"}• The "series" column must exactly match a collection name (e.g. "All-Star", "Jolt").{"\n"}• Unrecognized series values are skipped — that card won't appear in any collection.{"\n"}• Locations separator must be " | " (space-pipe-space) for multi-value fields.{"\n"}• isSellable is auto-derived from locations if the column is missing or blank.</p>
          </div>
        </>
      )}
    </div>
  );
}


// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [allCards,       setAllCards]       = useState({});  // { [seriesId]: Card[] } — Victor Martinez series
  const [otherCards,     setOtherCards]     = useState({});  // { [seriesName]: Card[] } — non-V-Mart
  const [seriesMeta,     setSeriesMeta]     = useState([]); // from meta API via items blob
  const [manifestInfo,   setManifestInfo]   = useState(null); // integrity check
  const [loadState,      setLoadState]      = useState("idle");
  const [fetchMethod,    setFetchMethod]    = useState(null);

  // Cache timestamps and refresh state
  const [itemsTs,            setItemsTs]            = useState(null);
  const [listingsTs,         setListingsTs]         = useState(null);
  const [itemsPhase,         setItemsPhase]         = useState(null);
  const [itemsPct,           setItemsPct]           = useState(null); // 0-100
  const [refreshingItems,    setRefreshingItems]    = useState(false);
  const [refreshingListings, setRefreshingListings] = useState(false);
  const [cancelPending,      setCancelPending]      = useState(false);
  const [itemsCancelled,     setItemsCancelled]     = useState(false);
  const [refreshMsg,         setRefreshMsg]         = useState(null);
  const [showWipeConfirm,    setShowWipeConfirm]    = useState(false);

  const [collected,      setCollected]      = useState({});
  const [includedSeries, setIncludedSeries] = useState(()=>{ const m={}; SERIES_LIST.forEach(s=>m[s.id]=true); return m; });
  const [activeTab,      setActiveTab]      = useState("summary");
  const [activeSeries,   setActiveSeries]   = useState(null);
  const [searchQuery,    setSearchQuery]    = useState("");

  const [showModal,   setShowModal]   = useState(false);
  const [diagLog,     setDiagLog]     = useState([]);
  const [diagResults, setDiagResults] = useState([]);
  const [diagRunning, setDiagRunning] = useState(false);

  // Restore collected from localStorage
  useEffect(()=>{
    try{ const s=localStorage.getItem(LS_KEY); if(s) setCollected(JSON.parse(s)); }catch{}
  },[]);

  const saveCollected = useCallback(next => {
    setCollected(next);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(next)); }catch{}
  }, []);

  const handleImport = useCallback(newCollected => { saveCollected(newCollected); }, [saveCollected]);

  // ── Merge new blob shape into app state ───────────────────────────────────
  // New items blob shape:
  //   cabData:   { [series_id]: { cards[], totalInCollection, totalInDatabase } }
  //   otherData: { [series_name]: { cards[], totalInDatabase } }
  // listingsData: { [series_id]: { [uuid]: { sellNowPrice, buyNowPrice } } }
  const mergeAndSet = useCallback((cache) => {
    const cabData      = cache.items?.cabData      || {};
    const otherData    = cache.items?.otherData    || {};
    const listingsData = cache.listings?.data      || {};
    const meta         = cache.items?.seriesMeta   || [];

    // Build allCards — Victor Martinez series only, prices overlaid by UUID
    const result = {};
    for (const series of SERIES_LIST) {
      const seriesData = cabData[series.id];
      const cards      = seriesData?.cards || [];

      // Resolve the series_id to use for price lookup. If series.id is a
      // placeholder (90001-90003 for Cityscapes/Mural/Vintage), try to find
      // the real series_id from seriesMeta by matching the series name.
      let priceLookupId = series.id;
      if (series.id.startsWith("9000")) {
        const realId = meta.find(s=>s.name===series.name)?.series_id;
        if (realId !== undefined) priceLookupId = String(realId);
      }

      const prices = listingsData[priceLookupId] || {};
      result[series.id] = cards.map(card => ({
        ...card,
        seriesDisplayName: card.series,
        sellNowPrice: prices[card.uuid]?.sellNowPrice || 0,
        buyNowPrice:  prices[card.uuid]?.buyNowPrice  || 0,
        seriesId: series.id,
      }));
    }
    setAllCards(result);

    // Build otherCards — non-V-Mart series, prices overlaid where available
    const otherResult = {};
    for (const [seriesName, sd] of Object.entries(otherData)) {
      const seriesId = meta.find(s=>s.name===seriesName)?.series_id;
      const prices   = seriesId ? (listingsData[String(seriesId)] || {}) : {};
      otherResult[seriesName] = (sd.cards||[]).map(card => ({
        ...card,
        sellNowPrice: prices[card.uuid]?.sellNowPrice || 0,
        buyNowPrice:  prices[card.uuid]?.buyNowPrice  || 0,
        seriesId: seriesId ? String(seriesId) : null,
      }));
    }
    setOtherCards(otherResult);
    setSeriesMeta(meta);

    if (cache.manifest) setManifestInfo(cache.manifest);
  }, []);

  // ── Load from Netlify Blob cache ──────────────────────────────────────────
  const loadFromCache = useCallback(async () => {
    setLoadState("loading");
    try {
      const res = await fetch(API_GET_CACHE);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const cache = await res.json();

      const hasItems    = !!(cache.items?.cabData);
      const hasListings = !!(cache.listings?.data);

      if (hasItems)    setItemsTs(cache.items.updatedAt);
      if (hasListings) setListingsTs(cache.listings.updatedAt);
      if (cache.manifest) setManifestInfo(cache.manifest);

      // Propagate refresh-in-progress state
      if (cache.itemsRefreshing) {
        setRefreshingItems(true);
        if (cache.itemsPctComplete !== null) setItemsPct(cache.itemsPctComplete);
        if (cache.itemsPhase) setItemsPhase(cache.itemsPhase);
      }
      if (cache.itemsCancelled) setItemsCancelled(true);

      if (hasItems) {
        mergeAndSet(cache);
        setFetchMethod("server cache");
        setLoadState("done");
        return true;
      }
    } catch(e) { /* fall through to idle */ }
    setLoadState("idle");
    return false;
  }, [mergeAndSet]);

  // On mount: load from shared Netlify Blob cache
  useEffect(()=>{
    loadFromCache();
  },[]);

  // ── Manual refresh buttons ────────────────────────────────────────────────
  // ── Background-aware refresh handlers ────────────────────────────────────
  // Background functions return 202 immediately. We fire the POST, set the
  // refreshing flag, then poll /api/get-cache every 5s. When the timestamp
  // changes we know the refresh is done, reload the data, and stop polling.

  const pollIntervalRef = useRef({});

  const startPolling = useCallback((type, previousTs) => {
    // Clear any existing poll for this type
    clearInterval(pollIntervalRef.current[type]);

    // Poll every 5 seconds
    pollIntervalRef.current[type] = setInterval(async () => {
      try {
        const res = await fetch(API_GET_CACHE);
        if (!res.ok) return;
        const cache = await res.json();

        const isStillRefreshing = type === "items"
          ? cache.itemsRefreshing
          : cache.listingsRefreshing;

        if (type === "items") {
          if (cache.itemsPhase)           setItemsPhase(cache.itemsPhase);
          if (cache.itemsPctComplete !== null) setItemsPct(cache.itemsPctComplete);
          if (cache.cancelPending)        setCancelPending(true);
          // Progressive update: reload card data after every poll during refresh
          if (cache.itemsRefreshing && cache.items?.cabData) {
            mergeAndSet(cache);
            setLoadState("done");
          }
          // Detect cancellation
          if (cache.itemsCancelled && !cache.itemsRefreshing) {
            clearInterval(pollIntervalRef.current[type]);
            setRefreshingItems(false);
            setCancelPending(false);
            setItemsPhase(null);
            setItemsPct(null);
            setRefreshMsg({ text:"🛑 Refresh stopped. Progress saved — click Refresh Cards to resume.", type:"warn" });
            await loadFromCache();
            return;
          }
        }

        const newTs = type === "items"
          ? cache.items?.updatedAt
          : cache.listings?.updatedAt;

        // Detect completion: refreshing flag cleared AND timestamp is newer
        if (!isStillRefreshing && newTs && newTs !== previousTs) {
          clearInterval(pollIntervalRef.current[type]);
          if (type === "items") {
            setRefreshingItems(false);
            setItemsPhase(null);
            setItemsPct(100);
            setItemsTs(newTs);
            setRefreshMsg({ text:`✓ Card database updated — ${cache.items?.totalCabreraCards||0} V-Mart cards + ${cache.items?.totalOtherCards||0} other cards across ${cache.items?.totalPages||0} pages`, type:"ok" });
          } else {
            setRefreshingListings(false);
            setListingsTs(newTs);
            setRefreshMsg({ text:`✓ Market prices updated — ${cache.listings?.totalListings||0} listings`, type:"ok" });
          }
          // Reload merged data into the app
          await loadFromCache();
        }
      } catch { /* polling failure — keep trying */ }
    }, 5000);

    // Safety: stop polling after 10 minutes regardless
    setTimeout(() => {
      if (pollIntervalRef.current[type]) {
        clearInterval(pollIntervalRef.current[type]);
        if (type === "items") { setRefreshingItems(false); setRefreshMsg({ text:"⏱ Items refresh is taking longer than expected — check back shortly", type:"warn" }); }
        else { setRefreshingListings(false); setRefreshMsg({ text:"⏱ Listings refresh is taking longer than expected — check back shortly", type:"warn" }); }
      }
    }, 600_000);
  }, [loadFromCache]);

  // Check for in-progress refreshes on initial cache load (e.g. scheduled refresh already running)
  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(API_GET_CACHE);
        if (!res.ok) return;
        const cache = await res.json();
        if (cache.itemsRefreshing) {
          setRefreshingItems(true);
          if (cache.itemsPhase) setItemsPhase(cache.itemsPhase);
          startPolling("items", cache.items?.updatedAt);
        }
        if (cache.listingsRefreshing) {
          setRefreshingListings(true);
          startPolling("listings", cache.listings?.updatedAt);
        }
      } catch {}
    })();
    return () => {
      clearInterval(pollIntervalRef.current.items);
      clearInterval(pollIntervalRef.current.listings);
    };
  }, []);

  const handleRefreshItems = useCallback(async () => {
    setRefreshingItems(true);
    setRefreshMsg({ text:"🔄 Card database refresh started in background…", type:"info" });
    const previousTs = itemsTs;
    try {
      // Fire and forget — background function returns 202 immediately
      await fetch(API_REFRESH_ITEMS, { method:"POST" });
    } catch(e) {
      setRefreshMsg({ text:`✗ Could not start items refresh: ${e.message}`, type:"err" });
      setRefreshingItems(false);
      return;
    }
    startPolling("items", previousTs);
  }, [itemsTs, startPolling]);

  const handleRefreshListings = useCallback(async () => {
    setRefreshingListings(true);
    setRefreshMsg({ text:"🔄 Market price refresh started in background…", type:"info" });
    const previousTs = listingsTs;
    try {
      await fetch(API_REFRESH_LISTINGS, { method:"POST" });
    } catch(e) {
      setRefreshMsg({ text:`✗ Could not start listings refresh: ${e.message}`, type:"err" });
      setRefreshingListings(false);
      return;
    }
    startPolling("listings", previousTs);
  }, [listingsTs, startPolling]);

  const handleCancelRefresh = useCallback(async () => {
    setCancelPending(true);
    try {
      await fetch(API_CANCEL_REFRESH, { method:"POST" });
      setRefreshMsg({ text:"🛑 Stop signal sent — refresh will halt before the next batch. Progress is saved.", type:"warn" });
    } catch(e) {
      setRefreshMsg({ text:`✗ Could not send stop signal: ${e.message}`, type:"err" });
    }
    // Don't clear refreshingItems yet — polling will detect when the function actually stops
  }, []);

  const handleWipeAll = useCallback(async () => {
    setShowWipeConfirm(false);
    try {
      const res = await fetch(API_DELETE_CARDS, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({wipe_all:true}) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error||"Wipe failed");
      setRefreshMsg({ text:"✓ All card data wiped. Click Refresh Cards to repopulate.", type:"ok" });
      setAllCards({});
      setItemsTs(null);
      setListingsTs(null);
      setLoadState("idle");
    } catch(e) {
      setRefreshMsg({ text:`✗ Wipe failed: ${e.message}`, type:"err" });
    }
  }, []);
  const runDiag = useCallback(async () => {
    setDiagRunning(true);
    const lines=[], results=[];
    const L=l=>{ lines.push(l); setDiagLog([...lines]); };
    const R=r=>{ results.push(r); setDiagResults([...results]); };
    L(`${new Date().toISOString()}`);
    L(`Origin: ${window.location.href}`);
    L(`Protocol: ${window.location.protocol}`);
    L(`Online: ${navigator.onLine}`);
    L(`UA: ${navigator.userAgent.substring(0,100)}`);
    L("─────────────────────────────────");
    if (!navigator.onLine) { R({label:"NETWORK",status:"fail",message:"Device is offline."}); setDiagRunning(false); return; }
    R({label:"NETWORK",status:"ok",message:"Internet connection active."});
    // Test Netlify cache endpoint
    L(`\nNetlify cache endpoint:`);
    try{
      const r=await fetch(API_GET_CACHE);
      L(`  HTTP ${r.status}`); if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const d=await r.json();
      L(`  items: ${d.items?"present ("+d.items.totalCards+" cards)":"null"}`);
      L(`  listings: ${d.listings?"present ("+d.listings.totalListings+" listings)":"null"}`);
      R({label:"CACHE",status:"ok",message:`Server cache reachable. Items: ${d.items?.totalCards||0} cards, Listings: ${d.listings?.totalListings||0} prices.`});
    }catch(e){ L(`  ✗ ${e.message}`); R({label:"CACHE",status:"fail",message:`Cache endpoint failed: ${e.message}. Functions may not be deployed yet.`}); }

    const testListingsUrl=`${BASE}/apis/listings.json?type=mlb_card&series_id=10045&page=1`;
    const testItemsUrl=`${BASE}/apis/items.json?type=mlb_card&series_id=10045&page=1`;
    L(`\nDirect (items):`);
    try{ const r=await fetch(testItemsUrl,{mode:"cors",cache:"no-store"}); L(`  HTTP ${r.status}`); if(!r.ok) throw new Error(`HTTP ${r.status}`); const d=await r.json(); L(`  ✓ items: ${d.items?.length}`); R({label:"DIRECT items",status:"ok",message:`Direct Items API works! Got ${d.items?.length} cards.`}); }
    catch(e){ L(`  ✗ ${e.name}: ${e.message}`); R({label:"DIRECT items",status:"fail",message:`${e.name}: ${e.message}`}); }
    L(`\nProxy 1 (items):`);
    try{ const proxied=PROXIES[0](testItemsUrl); const r=await fetch(proxied,{cache:"no-store"}); L(`  HTTP ${r.status}`); if(!r.ok) throw new Error(`HTTP ${r.status}`); const text=await r.text(); const d=JSON.parse(text); if(!d?.items) throw new Error(`No items field`); L(`  ✓ items: ${d.items.length}`); R({label:"PROXY1 items",status:"ok",message:`Proxy 1 works for Items API. Got ${d.items.length} cards.`}); }
    catch(e){ L(`  ✗ ${e.name}: ${e.message}`); R({label:"PROXY1 items",status:"fail",message:`${e.name}: ${e.message}`}); }
    L(`\nProxy 1 (listings):`);
    try{ const proxied=PROXIES[0](testListingsUrl); const r=await fetch(proxied,{cache:"no-store"}); L(`  HTTP ${r.status}`); if(!r.ok) throw new Error(`HTTP ${r.status}`); const text=await r.text(); const d=JSON.parse(text); if(!d?.listings) throw new Error(`No listings field`); L(`  ✓ listings: ${d.listings.length}`); R({label:"PROXY1 listings",status:"ok",message:`Proxy 1 works for Listings API. Got ${d.listings.length} cards.`}); }
    catch(e){ L(`  ✗ ${e.name}: ${e.message}`); R({label:"PROXY1 listings",status:"fail",message:`${e.name}: ${e.message}`}); }
    L(`\nComplete: ${new Date().toISOString()}`);
    setDiagRunning(false);
  },[]);

  const handleModalClose = useCallback(()=>{ setShowModal(false); },[]);

  const seriesStats=useMemo(()=>SERIES_LIST.map(series=>{
    const cards=allCards[series.id]||[];
    const cc=cards.filter(c=>collected[c.uuid]).length;
    const needed=Math.max(0,series.required-cc);

    // sellNowPrice = asking price — what you pay to acquire the card immediately (use for LOW estimate)
    // buyNowPrice  = bid price   — what buyers are currently offering (use for HIGH estimate)
    const marketCards    = cards.filter(c=>c.sellNowPrice>0||c.buyNowPrice>0);
    const nonMarketCards = cards.filter(c=>!c.sellNowPrice&&!c.buyNowPrice);

    const notCollectedMarket = marketCards.filter(c=>!collected[c.uuid]);

    // Low cost = sum of the cheapest (needed) cards by sellNowPrice (what you actually pay)
    const cheapest = [...notCollectedMarket]
      .filter(c=>c.sellNowPrice>0)
      .sort((a,b)=>a.sellNowPrice-b.sellNowPrice)
      .slice(0,needed);
    let low=0;
    cheapest.forEach(c=>{low+=c.sellNowPrice;});

    // High cost = sum of the most expensive (needed) cards by buyNowPrice (top bids = premium market)
    const expensive = [...notCollectedMarket]
      .filter(c=>c.buyNowPrice>0)
      .sort((a,b)=>b.buyNowPrice-a.buyNowPrice)
      .slice(0,needed);
    let high=0;
    expensive.forEach(c=>{high+=c.buyNowPrice;});

    const countMismatch = cards.length>0 && cards.length!==series.required;

    return{
      ...series, cards, collectedCount:cc, needed, lowCost:low, highCost:high,
      complete:cc>=series.required, totalCards:cards.length,
      marketCardCount:marketCards.length, nonMarketCount:nonMarketCards.length, countMismatch,
    };
  }),[allCards,collected]);

  const vmartTotal=useMemo(()=>{
    const inc=seriesStats.filter(s=>includedSeries[s.id]);
    if(inc.length<=REQUIRED_SERIES_COUNT) return{low:inc.reduce((a,s)=>a+s.lowCost,0),high:inc.reduce((a,s)=>a+s.highCost,0),count:inc.length};
    const sorted=[...inc].sort((a,b)=>a.lowCost-b.lowCost).slice(0,REQUIRED_SERIES_COUNT);
    return{low:sorted.reduce((a,s)=>a+s.lowCost,0),high:sorted.reduce((a,s)=>a+s.highCost,0),count:inc.length};
  },[seriesStats,includedSeries]);

  const totalCollected=Object.values(collected).filter(Boolean).length;

  const statusInfo=(()=>{
    if(loadState==="idle") return{dot:"dot-warn",text:"No card data — click Refresh Cards to load"};
    if(loadState==="loading") return{dot:"dot-spin",text:"Loading from server cache…"};
    if(loadState==="error") return{dot:"dot-err",text:"Failed — see troubleshoot"};
    const totCab=Object.values(allCards).reduce((a,c)=>a+c.length,0);
    const totOther=Object.values(otherCards).reduce((a,c)=>a+c.length,0);
    const m=fetchMethod?` · ${fetchMethod}`:"";
    const incomplete=manifestInfo&&!manifestInfo.complete;
    if(incomplete) return{dot:"dot-warn",text:`${totCab} V-Mart + ${totOther} other cards${m} · ⚠ incomplete (${manifestInfo.completedPages}/${manifestInfo.expectedPages} pages)`};
    return{dot:"dot-ok",text:`${totCab} V-Mart + ${totOther} other cards${m}`};
  })();

  // ── Timestamp display helpers ─────────────────────────────────────────────
  const tsClass = (ts) => !ts?"none":hoursAgo(ts)<2?"ok":hoursAgo(ts)<25?"ok":"old";

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div>
      {showModal && (
        <HostingModal
          onClose={handleModalClose}
          diagLog={diagLog} diagResults={diagResults} diagRunning={diagRunning}
          onRetest={()=>{ setDiagLog([]); setDiagResults([]); runDiag(); }}
        />
      )}

      {/* Wipe confirmation modal */}
      {showWipeConfirm && (
        <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) setShowWipeConfirm(false); }}>
          <div className="confirm-box">
            <h2>⚠️ Wipe All Card Data?</h2>
            <p>This will permanently delete <strong>all stored card information</strong> from the server cache — items, prices, checkpoints, and status. Your personal collected inventory (checkboxes) is not affected.</p>
            <p style={{marginTop:8,color:"var(--accent)",fontSize:12}}>You will need to run a full Refresh Cards after this to repopulate.</p>
            <div className="btn-row" style={{marginTop:16}}>
              <button className="btn btn-danger" onClick={handleWipeAll}>Wipe All Card Data</button>
              <button className="btn btn-secondary" onClick={()=>setShowWipeConfirm(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div className="app-header">
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
          <div>
            <div className="eyebrow">MLB The Show 26 · Diamond Dynasty</div>
            <h1>⚾ Victor Martinez Collection Tracker</h1>
            <div className="sub">99 OVR Milestone · Requires 24 of 26 sub-collections</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,paddingTop:4,flexShrink:0}}>
            <button
              onClick={()=>{ setShowModal(true); if(diagResults.length===0) runDiag(); }}
              style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",fontSize:11,fontFamily:"inherit",textDecoration:"underline",whiteSpace:"nowrap"}}
            >🔧 Troubleshoot</button>
            <button
              onClick={()=>setShowWipeConfirm(true)}
              style={{background:"none",border:"none",color:"#7f1d1d",cursor:"pointer",fontSize:10,fontFamily:"inherit",textDecoration:"underline",whiteSpace:"nowrap"}}
            >🗑 Wipe Card Data</button>
          </div>
        </div>
        <div className="header-stats">
          <div className="stat-box"><div className="stat-label">Cards Collected</div><div className="stat-value" style={{color:"var(--green)"}}>{totalCollected}</div></div>
          <div className="stat-box"><div className="stat-label">Included</div><div className="stat-value" style={{color:"var(--accent)"}}>{vmartTotal.count}/{TOTAL_SERIES_COUNT}</div></div>
          <div className="stat-box"><div className="stat-label">Est. Low Cost</div><div className="stat-value" style={{color:"var(--blue)"}}>{vmartTotal.low>0?`${(vmartTotal.low/1000).toFixed(0)}K`:"—"}<span style={{fontSize:10}}> stubs</span></div></div>
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs">
        <button className={`tab-btn ${activeTab==="summary"?"active":""}`} onClick={()=>{setActiveTab("summary");setActiveSeries(null);}}>📊 Summary</button>
        <button className={`tab-btn ${activeTab==="cards"?"active":""}`}   onClick={()=>setActiveTab("cards")}>🃏 Cards</button>
        <button className={`tab-btn ${activeTab==="search"?"active":""}`}  onClick={()=>setActiveTab("search")}>🔍 Player Search</button>
        <button className={`tab-btn ${activeTab==="csv"?"active":""}`}     onClick={()=>setActiveTab("csv")}>📁 CSV</button>
      </div>

      {/* ── Refresh Panel ── */}
      <div className="refresh-panel">
        {/* Items refresh */}
        <div className="refresh-block">
          <div className="refresh-block-label">Card Database (Items API)</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            {refreshingItems && <span className="sdot dot-spin" style={{flexShrink:0}}/>}
            <div className={`refresh-ts ${refreshingItems?"ok":tsClass(itemsTs)}`}>
              {refreshingItems
                ? (itemsPhase || "Updating in background…")
                : itemsCancelled
                  ? "Stopped — click Refresh Cards to resume"
                  : itemsTs ? `Updated: ${fmtTs(itemsTs)}` : "No data yet"}
            </div>
          </div>
          {/* Progress bar — shown during refresh */}
          {refreshingItems && itemsPct !== null && (
            <div style={{marginTop:5}}>
              <div style={{height:4,background:"var(--border)",borderRadius:2,overflow:"hidden",width:"100%"}}>
                <div style={{height:"100%",background:"var(--accent)",borderRadius:2,
                  width:`${itemsPct}%`,transition:"width .5s ease"}}/>
              </div>
              <div style={{fontSize:9,color:"var(--dim)",marginTop:2}}>{itemsPct}% complete</div>
            </div>
          )}
          {/* Integrity warning */}
          {manifestInfo && !manifestInfo.complete && !refreshingItems && (
            <div style={{fontSize:10,color:"var(--red)",marginTop:3}}>
              ⚠ Incomplete: {manifestInfo.completedPages}/{manifestInfo.expectedPages} pages loaded
            </div>
          )}
          <div style={{marginTop:4,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button className="refresh-btn" onClick={handleRefreshItems} disabled={refreshingItems}
              title={refreshingItems?"Refresh already in progress":"Fetch latest card database from TheShow.com"}>
              {refreshingItems ? <><span className="spin-sm"/> In progress…</> : "🔄 Refresh Cards"}
            </button>
            {refreshingItems && (
              <button onClick={handleCancelRefresh} disabled={cancelPending}
                style={{background:"none",border:"none",color:cancelPending?"var(--dim)":"var(--red)",
                  cursor:cancelPending?"not-allowed":"pointer",fontSize:11,fontFamily:"inherit",
                  textDecoration:"underline",padding:0}}>
                {cancelPending ? "⏳ Stop signal sent…" : "⛔ Stop Process"}
              </button>
            )}
          </div>
          <div style={{fontSize:9,color:"var(--dim)",marginTop:3}}>Auto-refreshes weekly on Sundays at 2 AM Pacific</div>
        </div>

        <div className="refresh-divider"/>

        {/* Listings refresh */}
        <div className="refresh-block">
          <div className="refresh-block-label">Market Prices (Listings API)</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            {refreshingListings && <span className="sdot dot-spin" style={{flexShrink:0}}/>}
            <div className={`refresh-ts ${refreshingListings?"ok":tsClass(listingsTs)}`}>
              {refreshingListings
                ? "Updating in background…"
                : listingsTs ? `Updated: ${fmtTs(listingsTs)}` : "No data yet"}
            </div>
          </div>
          <div style={{marginTop:4}}>
            <button
              className="refresh-btn"
              onClick={handleRefreshListings}
              disabled={refreshingListings}
              title={refreshingListings?"Refresh already in progress":"Fetch latest market prices from TheShow.com"}
            >
              {refreshingListings
                ? <><span className="spin-sm"/> In progress…</>
                : "🔄 Refresh Prices"}
            </button>
            <div style={{fontSize:9,color:"var(--dim)",marginTop:3}}>Auto-refreshes at 6 AM and 8 PM Pacific daily</div>
          </div>
        </div>

        {/* Refresh result message */}
        {refreshMsg && (
          <div style={{width:"100%",padding:"6px 10px",borderRadius:6,fontSize:11,
            background: refreshMsg.type==="ok"?"#052e16":refreshMsg.type==="info"?"#0c1a3a":refreshMsg.type==="warn"?"#1a1500":"#1a0a0a",
            border:`1px solid ${refreshMsg.type==="ok"?"#065f46":refreshMsg.type==="info"?"#1e3a8a":refreshMsg.type==="warn"?"#78350f":"#7f1d1d"}`,
            color: refreshMsg.type==="ok"?"var(--green)":refreshMsg.type==="info"?"var(--blue)":refreshMsg.type==="warn"?"var(--accent)":"var(--red)"}}>
            {refreshMsg.text}
          </div>
        )}
      </div>

      {/* Loading indicator */}
      {loadState==="loading"&&(
        <div style={{background:"var(--surface2)",padding:"10px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10}}>
          <span className="spin-sm"/>
          <span style={{fontSize:11,color:"var(--accent)"}}>Loading card data from server cache…</span>
        </div>
      )}

      {/* Integrity warning banner */}
      {manifestInfo && !manifestInfo.complete && loadState==="done" && (
        <div className="alert alert-warn" style={{margin:"10px 14px"}}>
          ⚠️ Card data may be incomplete — {manifestInfo.completedPages} of {manifestInfo.expectedPages} pages loaded.
          Click <strong>🔄 Refresh Cards</strong> to complete the load.
        </div>
      )}

      {/* Idle / Error state */}
      {(loadState==="idle"||loadState==="error")&&activeTab!=="csv"&&(
        <div style={{textAlign:"center",padding:"40px 16px",color:"var(--dim)"}}>
          {loadState==="idle"
            ?(<><div style={{fontSize:32,marginBottom:8}}>⚾</div><div style={{fontSize:13,color:"var(--accent)",marginBottom:4}}>No card data loaded yet</div><div style={{fontSize:12}}>Click <strong>🔄 Refresh Cards</strong> in the panel above to load the card database.</div></>)
            :(<><div style={{fontSize:32,marginBottom:8}}>🚫</div><div style={{fontSize:13,color:"var(--red)",marginBottom:4}}>Could not load card data</div><div style={{fontSize:12,marginBottom:14}}>Check the troubleshoot link or click Refresh Cards to try again.</div></>)
          }
        </div>
      )}

      {/* ── Summary Tab ── */}
      {loadState==="done"&&activeTab==="summary"&&(
        <div className="page">
          <div className="cabrera-banner">
            <div className="eyebrow">Collection Goal</div>
            <h2>99 OVR Milestone Victor Martinez</h2>
            <div className="note">Check exactly 24 of 26 collections · Uncheck two to skip them</div>
            <div className="cabrera-costs">
              <div><div className="cost-label">Low Cost</div><div className="cost-value" style={{color:"var(--green)"}}>{vmartTotal.low.toLocaleString()}</div><div className="cost-unit">stubs</div></div>
              <div><div className="cost-label">High Cost</div><div className="cost-value" style={{color:"var(--red)"}}>{vmartTotal.high.toLocaleString()}</div><div className="cost-unit">stubs</div></div>
            </div>
          </div>
          {vmartTotal.count>REQUIRED_SERIES_COUNT&&<div className="alert alert-warn">⚠️ {vmartTotal.count} checked — only {REQUIRED_SERIES_COUNT} needed. Totals show cheapest {REQUIRED_SERIES_COUNT}. Uncheck extras to exclude them manually.</div>}
          {vmartTotal.count<REQUIRED_SERIES_COUNT&&<div className="alert alert-err">⚠️ Only {vmartTotal.count} checked — need at least {REQUIRED_SERIES_COUNT}.</div>}
          <div style={{fontSize:10,color:"var(--dim)",marginTop:8,lineHeight:1.7,padding:"0 2px"}}>
            <strong style={{color:"var(--dim)"}}>Mkt</strong> = cards currently listed on the Community Market for this series &nbsp;·&nbsp;
            <strong style={{color:"var(--dim)"}}>⚠</strong> = market count differs from required count (some cards may be program-only or not yet listed) &nbsp;·&nbsp;
            Stub costs only include <strong style={{color:"var(--dim)"}}>market-priced cards</strong> — program reward cards are excluded from cost estimates
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr>
                <th>✓</th>
                <th className="left">Collection</th>
                <th title="Cards required to complete this collection">Need</th>
                <th title="Market cards currently listed for this series">Mkt</th>
                <th title="Warning if listed card count differs from required count">⚠</th>
                <th>Have</th>
                <th>Left</th>
                <th>Low (stubs)</th>
                <th>High (stubs)</th>
                <th>%</th>
                <th></th>
              </tr></thead>
              <tbody>
                {seriesStats.map(s=>(
                  <tr key={s.id} className={includedSeries[s.id]?"":"xrow"}>
                    <td className="center"><input type="checkbox" checked={!!includedSeries[s.id]} onChange={()=>setIncludedSeries(p=>({...p,[s.id]:!p[s.id]}))} style={{accentColor:"#e8b84b"}}/></td>
                    <td className="left" style={{fontWeight:"bold",color:s.complete?"var(--green)":"var(--text)"}}>{s.name}</td>
                    <td className="center" style={{color:"var(--dim)"}}>{s.required}</td>
                    <td className="center" style={{color:"var(--dim)"}}>{s.totalCards>0?s.totalCards:"—"}</td>
                    <td className="center">
                      {s.totalCards>0 && s.countMismatch
                        ? <span title={`${s.totalCards} cards in market vs ${s.required} required — some cards may not be listed yet`} style={{color:"var(--accent)",cursor:"help"}}>⚠</span>
                        : s.totalCards>0
                          ? <span style={{color:"var(--green)"}}>✓</span>
                          : <span style={{color:"var(--dim)"}}>—</span>}
                    </td>
                    <td className="center" style={{color:"var(--green)"}}>{s.collectedCount}</td>
                    <td className="center" style={{color:s.needed===0?"var(--green)":"var(--accent)"}}>{s.needed}</td>
                    <td className="right" style={{color:"var(--blue)"}}>{s.lowCost>0?s.lowCost.toLocaleString():"—"}</td>
                    <td className="right" style={{color:s.highCost>0?"var(--red)":"var(--dim)"}}>{s.highCost>0?s.highCost.toLocaleString():"—"}</td>
                    <td className="center">{s.complete?<span className="prog-pill prog-done">✓</span>:<span className="prog-pill">{Math.round((s.collectedCount/s.required)*100)}%</span>}</td>
                    <td className="center"><button className="view-btn" onClick={()=>{setActiveSeries(s.id);setActiveTab("cards");setSearchQuery("");}}>→</button></td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr>
                  <td colSpan={2} className="left" style={{color:"var(--accent)"}}>🏆 VICTOR MARTINEZ ({REQUIRED_SERIES_COUNT}/{TOTAL_SERIES_COUNT})</td>
                  <td className="center">{REQUIRED_SERIES_COUNT}</td>
                  <td className="center" style={{color:"var(--dim)"}}>—</td>
                  <td></td>
                  <td className="center" style={{color:"var(--dim)"}}>—</td>
                  <td className="center" style={{color:"var(--dim)"}}>—</td>
                  <td className="right" style={{color:"var(--green)"}}>{vmartTotal.low.toLocaleString()}</td>
                  <td className="right" style={{color:"var(--red)"}}>{vmartTotal.high.toLocaleString()}</td>
                  <td colSpan={2}></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      )}

      {/* ── Cards Tab ── */}
      {loadState==="done"&&activeTab==="cards"&&(
